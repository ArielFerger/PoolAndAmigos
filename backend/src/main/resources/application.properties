spring.application.name=backend

# Los valores reales llegan como variables de entorno desde docker compose.
# Los defaults sirven para correr el backend fuera de Docker contra la base local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/poolamigos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:poolamigos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:poolamigos_dev}

# Flyway es la fuente de verdad del esquema; JPA solo verifica que el mapeo coincida.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El corte del dia para la caja se calcula en hora argentina.
spring.jackson.time-zone=America/Argentina/Buenos_Aires
